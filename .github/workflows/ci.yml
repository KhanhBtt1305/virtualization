name: CI Quality Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project_CNPM_NEW/my-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: Project_CNPM_NEW/my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Build (includes ESLint check)
        run: npm run build
        env:
          CI: true # Bật cờ này để ép bắt lỗi linter giống hệt môi trường Production
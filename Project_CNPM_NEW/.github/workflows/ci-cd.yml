name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project_CNPM_NEW
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Project_CNPM_NEW/backend/package-lock.json
            Project_CNPM_NEW/my-app/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: Project_CNPM_NEW/backend

      - name: Check backend syntax
        run: node --check server.js
        working-directory: Project_CNPM_NEW/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Project_CNPM_NEW/my-app

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests
        working-directory: Project_CNPM_NEW/my-app

      - name: Build frontend
        run: npm run build
        working-directory: Project_CNPM_NEW/my-app

  container:
    name: Build containers
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose -f Project_CNPM_NEW/docker-compose.yml config

      - name: Build Docker images
        run: docker compose -f Project_CNPM_NEW/docker-compose.yml build

  publish:
    name: Publish images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ env.IMAGE_NAMESPACE }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend=${{ env.REGISTRY }}/${owner}/g5bus-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ env.REGISTRY }}/${owner}/g5bus-frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: Project_CNPM_NEW/backend
          push: true
          tags: |
            ${{ steps.image.outputs.backend }}:${{ github.sha }}
            ${{ steps.image.outputs.backend }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: Project_CNPM_NEW
          push: true
          tags: |
            ${{ steps.image.outputs.frontend }}:${{ github.sha }}
            ${{ steps.image.outputs.frontend }}:latest

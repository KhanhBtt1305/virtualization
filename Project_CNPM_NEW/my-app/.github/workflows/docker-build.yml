name: CI/CD Pipeline - Docker Build

# Định nghĩa sự kiện kích hoạt Pipeline
on:
  push:
    branches: [ "main" ] # Chạy khi đẩy code lên nhánh main
  pull_request:
    branches: [ "main" ]

jobs:
  build-docker-image:
    runs-on: ubuntu-latest # Chạy trên máy chủ ảo Linux miễn phí của GitHub

    steps:
      # Bước 1: Tải mã nguồn từ GitHub repository xuống môi trường chạy
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Docker Buildx (công cụ build Docker hiện đại)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3: Kiểm tra và Build thử Docker Image từ Dockerfile của nhóm
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Project_CNPM_NEW  # Trỏ vào đúng thư mục chứa Dockerfile của nhóm
          file: ./Project_CNPM_NEW/Dockerfile
          push: false # Đặt là true nếu muốn đẩy image lên Docker Hub sau khi build xong
          tags: virtualization-demo:latest

      - name: Verify Build Success
        run: echo "Pipeline build Docker image thanh cong!"